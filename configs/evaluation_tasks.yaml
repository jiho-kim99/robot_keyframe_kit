schema_version: 1
home_deg:
  r_shoulder_roll: -12
  l_shoulder_roll: 12
  r_elbow_pitch: 25
  l_elbow_pitch: 25
tasks:
  pick_and_place:
    label: Pick & Place
    motion_duration: 16.0
    reference_duration: 16.0
    repeat: true
    representation: Top-down IK waypoints; front -> right 90 degrees (arm only) ->
      front -> rear 180 degrees (waist yaw); visual grasp preview only
    load: {}
    planner: front_right_rear
    layout:
      radius_m: 0.38
      table_height_offset_m: 0.0
      object_height_m: 0.04
      grasp_offset_m: 0.025
      lift_clearance_m: 0.14
      basket_height_m: 0.06
  heavy_box_lift:
    label: Heavy Box Lift
    motion_duration: 6
    reference_duration: 4.0
    repeat: true
    representation: Representative joint-space motion; not an exact Cartesian constraint
      or grasp simulation
    keyframes_deg:
    - {}
    - r_shoulder_pitch: -25
      l_shoulder_pitch: -25
      r_elbow_pitch: 35
      l_elbow_pitch: 35
    - {}
    load:
      sites:
      - right
      - left
      object_mass_kg: 0
